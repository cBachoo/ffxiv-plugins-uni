name: Update Plugins List

on:
  schedule:
    - cron: "0 */6 * * *" # Every 6 hours
  workflow_dispatch:

permissions:
  contents: write # allow GITHUB_TOKEN to push the updated repo.json

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6

      - name: Run update script
        run: |
          uv run update

      - name: Verify changed files
        uses: tj-actions/verify-changed-files@a1c6acee9df209257a246f2cc6ae8cb6581c1edf
        id: changed-files
        with:
          files: repo.json

      - name: Commit files
        if: steps.changed-files.outputs.files_changed == 'true'
        uses: EndBug/add-and-commit@v10
        with:
          message: Update repo.json
